<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0f0f13"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="MMEX"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" type="image/png" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>MMEX Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
<style>
:root{--bg:#0f0f13;--cd:#17171d;--bd:#26262e;--tx:#e8e8ee;--mu:#8a8a96;--or:#f97316;--gr:#4ade80;--rd:#f87171}
@media(prefers-color-scheme:light){:root{--bg:#f6f5f2;--cd:#fff;--bd:#e4e2dc;--tx:#1c1c22;--mu:#6b6b76;--gr:#16a34a;--rd:#dc2626}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100vw}
body{background:var(--bg);color:var(--tx);font:13px 'DM Mono',monospace;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--or);border-radius:2px}
.w{max-width:1000px;margin:0 auto;padding:14px 14px 40px}
h1{font:800 20px Syne,sans-serif}.or{color:var(--or)}.mu{color:var(--mu)}.gr{color:var(--gr)}.rd{color:var(--rd)}small{font-size:10.5px}
button,select,input{font:inherit;color:inherit;cursor:pointer}input{cursor:text}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.tb,.yr,.ft,.sw{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;align-items:center}
.tb button{flex:1;padding:8px 2px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);font-size:11px;text-transform:uppercase;white-space:nowrap}
.tb button.on,.ch.on,.pb{background:var(--or);border-color:var(--or);color:#0f0f13;font-weight:600}
.ch,.gb,select{padding:5px 12px;border-radius:20px;border:1px solid var(--bd);background:var(--cd);font-size:11px;white-space:nowrap}
.pb{padding:10px 22px;border-radius:12px;border:0}
select{max-width:60%;border-radius:10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(min-width:800px){.g{grid-template-columns:repeat(4,1fr)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}}
.g .cd{margin:0}.sv{font:700 15px Syne,sans-serif;margin-top:4px;word-break:break-word}
.rt,.ar,.mv,.pr{display:flex;justify-content:space-between;gap:10px}
.ar{padding:7px 0;border-top:1px solid var(--bd);cursor:pointer}
.row{padding:9px 0;border-top:1px solid var(--bd);cursor:pointer}
.bar{height:5px;background:var(--bd);border-radius:3px;margin:5px 0 3px}.bar i{display:block;height:100%;border-radius:3px;background:var(--or)}
.mv{padding:9px 0;border-top:1px solid var(--bd)}.mv>div:first-child{min-width:0}.mv small{display:block;color:var(--mu);overflow:hidden;text-overflow:ellipsis}.mv b{white-space:nowrap;font-weight:500}
.pl{opacity:.65}.bd{background:var(--or);color:#0f0f13;font-size:9px;font-weight:600;padding:1px 6px;border-radius:20px;margin-left:6px}
.pr{display:grid;grid-template-columns:.9fr 1fr 1fr 1fr;padding:8px 0;border-top:1px solid var(--bd);font-size:11.5px;text-align:right}.pr>:first-child{text-align:left}.pr small{grid-column:1/-1}
.mc{display:flex;gap:3px;align-items:flex-end;height:110px}.mc>div{flex:1;text-align:center;cursor:pointer}.cb{height:90px;display:flex;align-items:flex-end;gap:1px}.cb i{flex:1;border-radius:2px 2px 0 0;min-height:1px}
input[type=search]{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);margin-bottom:10px}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1}}.fade{animation:f .25s}
</style></head>
<body><div id="app"></div><input type="file" id="fi" hidden/>
<script>
const CDN='https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/',$=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null,S={tab:'panel',year:'',acc:'',plan:false,f:{},type:'all',per:'m',lvl:0,q:'',lim:150,err:''};
const today=new Date().toLocaleDateString('sv');
const idb=(m,v)=>new Promise(r=>{const o=indexedDB.open('mmexv',1);o.onupgradeneeded=()=>o.result.createObjectStore('k');o.onerror=()=>r();o.onsuccess=()=>{const s=o.result.transaction('k',m==='get'?'readwrite':'readwrite').objectStore('k'),q=m==='get'?s.get('f'):s.put(v,'f');q.onsuccess=()=>r(q.result);q.onerror=()=>r()}});

async function load(buf,fn,fd){
 try{
 const SQL=await initSqlJs({locateFile:f=>CDN+f}),db=new SQL.Database(new Uint8Array(buf));
 const q=s=>{const r=db.exec(s)[0];return r?r.values.map(v=>Object.fromEntries(r.columns.map((c,i)=>[c,v[i]]))):[]},t=(a,b)=>{try{return q(a)}catch(e){return q(b)}};
 const cur={};q('select * from CURRENCYFORMATS_V1').forEach(c=>{const nm=(c.CURRENCY_SYMBOL||'')+(c.CURRENCYNAME||'')+(c.CURRENCY_SYMBOL||'');cur[c.CURRENCYID]={s:c.CURRENCY_SYMBOL||c.CURRENCYNAME,r:c.BASECONVRATE||1,dec:/PYG|Guaran|₲|Gs/i.test(nm)?0:Math.round(Math.log10(c.SCALE||1))}});
 const bid=+(q("select INFOVALUE v from INFOTABLE_V1 where INFONAME='BASECURRENCYID'")[0]?.v)||+Object.keys(cur)[0];
 const cm={};q('select * from CATEGORY_V1').forEach(c=>cm[c.CATEGID]=c);
 const path=id=>{const c=cm[id];return c?(c.PARENTID>0&&cm[c.PARENTID]?path(c.PARENTID)+':':'')+c.CATEGNAME:'Sin categoría'};
 const pm={};q('select * from PAYEE_V1').forEach(p=>pm[p.PAYEEID]=p.PAYEENAME);
 const A={};q('select * from ACCOUNTLIST_V1').forEach(a=>A[a.ACCOUNTID]={id:a.ACCOUNTID,name:a.ACCOUNTNAME,cur:a.CURRENCYID,init:a.INITIALBAL||0,open:a.STATUS!=='Closed'});
 const sp={};t('select * from SPLITTRANSACTIONS_V1','select 1 where 0').forEach(s=>(sp[s.TRANSID]=sp[s.TRANSID]||[]).push(s));
 const tr=t("select * from CHECKINGACCOUNT_V1 where IFNULL(DELETEDTIME,'')=''",'select * from CHECKINGACCOUNT_V1');
 const R=[],T=[];
 tr.forEach(x=>{if(x.STATUS==='V')return;
  const d=String(x.TRANSDATE).slice(0,10),tp=x.TRANSCODE,rate=cur[A[x.ACCOUNTID]?.cur]?.r||1;
  const b={id:x.TRANSID,d,a:x.ACCOUNTID,ta:x.TOACCOUNTID,tp,s:x.STATUS,n:x.NOTES||'',p:x.PAYEEID>0?pm[x.PAYEEID]||'':'',amt:x.TRANSACTIONAMOUNT??x.TRANSAMOUNT,tamt:x.TOTRANSAMOUNT,plan:d>today};
  R.push(b);const ss=sp[x.TRANSID],mk=(amt,c,n)=>T.push({...b,amt,c,n,v:tp==='Transfer'?0:(tp==='Deposit'?1:-1)*amt*rate});
  if(ss&&tp!=='Transfer')ss.forEach(s=>mk(s.SPLITTRANSAMOUNT,path(s.CATEGID),s.NOTES||b.n));else mk(b.amt,tp==='Transfer'?'':path(x.CATEGID),b.n)});
 D={cur,bid,A,R,T,fn,fd};S.err='';
 }catch(e){D=null;S.err='No se pudo leer el archivo (¿está cifrado o no es .mmex?). '+e.message}
 render()}

const fm=(n,c)=>{c=c||D.cur[D.bid];return(n<0?'−':'')+Math.abs(n).toLocaleString('es-PY',{minimumFractionDigits:c.dec,maximumFractionDigits:c.dec})+' '+c.s},
 fn=n=>fm(n).replace(' '+D.cur[D.bid].s,''),ac=id=>D.cur[D.A[id]?.cur]||D.cur[D.bid],
 accOk=x=>!S.acc||x.a==S.acc||x.ta==S.acc,
 bar=p=>`<div class=bar><i style="width:${Math.max(0,p)}%"></i></div>`,
 stat=(l,v,c)=>`<div class=cd><small class=mu>${l}</small><div class="sv ${c||''}">${v}</div></div>`;
function rows(o={}){return D.T.filter(x=>(o.plan||S.plan||!x.plan)&&(!S.year||x.d.startsWith(S.year))&&accOk(x)&&(!o.f||((!S.f.c||x.c===S.f.c||x.c.startsWith(S.f.c+':'))&&(!S.f.p||(x.p||'—')===S.f.p)&&(!S.f.m||x.d.startsWith(S.f.m)))))}
const ex=()=>rows().filter(x=>x.tp!=='Transfer');
function grp(a,k){const m={};a.forEach(x=>{const g=k(x),o=m[g]=m[g]||{k:g,e:0,i:0,n:0};x.tp==='Deposit'?o.i+=x.v:o.e-=x.v;o.n++});return Object.values(m)}
function mo(a){const ms=[...new Set(a.map(x=>x.d.slice(0,7)))].sort();if(!ms.length)return 1;const[y1,m1]=ms[0].split('-'),[y2,m2]=ms.at(-1).split('-');return(y2-y1)*12+(m2-m1)+1}
function bal(){const b={};for(const k in D.A)b[k]=D.A[k].init;D.R.forEach(x=>{if(x.plan&&!S.plan)return;if(x.tp==='Transfer'){if(x.a in b)b[x.a]-=x.amt;if(x.ta in b)b[x.ta]+=x.tamt}else if(x.a in b)b[x.a]+=(x.tp==='Deposit'?1:-1)*x.amt});return b}

function panel(){
 const a=ex(),M=mo(a),b=bal(),I=a.reduce((s,x)=>s+(x.tp==='Deposit'?x.v:0),0),X=a.reduce((s,x)=>s+(x.tp!=='Deposit'?-x.v:0),0);
 const g=grp(a,x=>x.d.slice(0,7)).sort((p,q)=>p.k>q.k?1:-1),ch=S.year?g:g.slice(-12),mx=Math.max(1,...ch.map(x=>Math.max(x.i,x.e))),top=g.slice().sort((p,q)=>q.e-p.e)[0];
 const G={};Object.values(D.A).filter(x=>x.open||b[x.id]).forEach(x=>(G[x.cur]=G[x.cur]||[]).push(x));let net=0;
 const accs=Object.entries(G).map(([c,l])=>{const cu=D.cur[c],s=l.reduce((t,x)=>t+b[x.id],0);net+=s*cu.r;return`<div class=cd><div class=rt><b>${E(cu.s)}</b><b>${fm(s,cu)}</b></div>${l.sort((p,q)=>b[q.id]-b[p.id]).map(x=>`<div class=ar data-a=acc data-v=${x.id}><span>${E(x.name)}</span><span class="${b[x.id]<0?'rd':''}">${fm(b[x.id],cu)}</span></div>`).join('')}</div>`}).join('');
 const P=D.T.filter(x=>x.plan&&x.tp!=='Transfer'&&accOk(x)),pv=P.reduce((s,x)=>s+x.v,0),pl=P.map(x=>x.d).sort().at(-1);
 const tp=(k,n)=>grp(a,k).sort((p,q)=>q.e-p.e).slice(0,n).filter(x=>x.e>0),top5=(l,t)=>l.map(x=>`<div class=row data-a=drill data-t=${t} data-v="${E(x.k)}"><div class=rt><span>${E(x.k)}</span><b>${fn(x.e)}</b></div>${bar(x.e/l[0].e*100)}</div>`).join('');
 const big=a.filter(x=>x.tp==='Withdrawal').sort((p,q)=>p.v-q.v).slice(0,5);
 return`<div class=g>${stat('Patrimonio ('+E(D.cur[D.bid].s)+')',fm(net),net<0?'rd':'')}${stat('Balance período',fm(I-X),I-X<0?'rd':'gr')}${stat('Ingresos',fm(I),'gr')}${stat('Gastos',fm(X),'rd')}${stat('Prom. gasto/mes',fm(X/M))}${stat('Prom. ingreso/mes',fm(I/M))}${stat('Tasa de ahorro',I?Math.round((I-X)/I*100)+'%':'—')}${stat('Mes más alto',top?top.k+'<br><small>'+fm(top.e)+'</small>':'—')}</div>
 ${P.length?`<div class=cd style="margin-top:10px;cursor:pointer" data-a=typ data-v=plan><small class=mu>PLANIFICADO PENDIENTE · ${P.length} movs${pl?' · hasta '+pl:''}</small><div class=sv>${fm(pv)}</div>${S.plan?'':`<small class=mu>Patrimonio proyectado: ${fm(net+pv)}</small>`}</div>`:''}
 <h1 style="font-size:14px;margin:14px 0 8px">Cuentas</h1>${accs}
 <h1 style="font-size:14px;margin:14px 0 8px">${S.year||'Últimos 12 meses'}</h1><div class=cd><div class=mc>${ch.map(x=>`<div data-a=drill data-t=m data-v=${x.k}><div class=cb><i style="height:${x.i/mx*100}%;background:var(--gr)"></i><i style="height:${x.e/mx*100}%;background:var(--rd)"></i></div><small class=mu>${x.k.slice(5)}</small></div>`).join('')}</div><small class=mu><span class=gr>■</span> ingresos <span class=rd>■</span> gastos</small></div>
 <div class=g2><div class=cd><small class=mu>TOP CATEGORÍAS</small>${top5(tp(x=>x.c.split(':')[0],5),'c')}</div><div class=cd><small class=mu>TOP BENEFICIARIOS</small>${top5(tp(x=>x.p||'—',5),'p')}</div></div>
 <div class=cd><small class=mu>MAYORES GASTOS</small>${big.map(mv).join('')}</div>`}

function rank(t){
 const a=ex(),M=mo(a),k=t==='c'?(S.lvl?x=>x.c.split(':')[0]:x=>x.c):x=>x.p||'—',g=grp(a,k).filter(x=>x.e||x.i).sort((p,q)=>q.e-p.e),mx=Math.max(1,...g.map(x=>x.e)),tot=g.reduce((s,x)=>s+(x.e>0?x.e:0),0)||1;
 return`<div class=sw>${t==='c'?`<button class="ch${S.lvl?'':' on'}" data-a=lvl data-v=0>Completa</button><button class="ch${S.lvl?' on':''}" data-a=lvl data-v=1>Principal</button>`:''}<small class=mu>Gastos ${fm(tot)} · ${g.length} ítems</small></div>`+g.map(x=>`<div class=row data-a=drill data-t=${t} data-v="${E(x.k)}"><div class=rt><span>${E(x.k)}</span><b>${fm(x.e)}</b></div>${bar(x.e/mx*100)}<small class=mu>${x.n} mov · prom/mes ${fm(x.e/M)} · ${Math.round(x.e/tot*100)}%${x.i?' · ingresos '+fm(x.i):''}</small></div>`).join('')}

function pers(){
 const a=ex(),m=S.per==='m',g=grp(a,x=>x.d.slice(0,m?7:4)).sort((p,q)=>q.k>p.k?1:-1),M=mo(a),I=g.reduce((s,x)=>s+x.i,0),X=g.reduce((s,x)=>s+x.e,0);
 const r=(l,i,e,s,sub,at)=>`<div class=pr ${at||''}><span>${l}</span><span class=gr>${fn(i)}</span><span class=rd>${fn(e)}</span><b class="${s<0?'rd':''}">${fn(s)}</b>${sub?`<small class=mu>${sub}</small>`:''}</div>`;
 return`<div class=sw><button class="ch${m?' on':''}" data-a=per data-v=m>Mensual</button><button class="ch${m?'':' on'}" data-a=per data-v=y>Anual</button><small class=mu>en ${E(D.cur[D.bid].s)}</small></div><div class=pr style="border:0"><small class=mu>Período</small><small class=mu>Ingresos</small><small class=mu>Gastos</small><small class=mu>Neto</small></div>`+
 r('<b>Prom./mes</b>',I/M,X/M,(I-X)/M)+r('<b>Total</b>',I,X,I-X)+
 g.map(x=>{const n=m?1:mo(a.filter(y=>y.d.startsWith(x.k)));return r(x.k,x.i,x.e,x.i-x.e,m?'':`prom/mes: +${fn(x.i/n)} / −${fn(x.e/n)}`,`data-a=${m?'drill':'yr'} data-t=m data-v=${x.k} style="cursor:pointer"`)}).join('')}

function mv(x){const T=x.tp==='Transfer',c=ac(x.a),s=T?'':(x.tp==='Deposit'?1:-1);
 return`<div class="mv${x.plan?' pl':''}"><div><div>${E(T?(D.A[x.a]?.name+' → '+D.A[x.ta]?.name):x.p||'—')}${x.plan?'<span class=bd>plan</span>':''}</div><small>${x.d} · ${E(x.c||'Transferencia')}${T?'':' · '+E(D.A[x.a]?.name)}${x.n?' · '+E(x.n):''}</small></div><b class="${T?'':s>0?'gr':'rd'}">${fm((s||1)*x.amt,c)}</b></div>`}
function list(){
 let a=rows({f:1,plan:S.type==='plan'});const q=S.q.toLowerCase();
 if(S.type==='plan')a=a.filter(x=>x.plan);else if(S.type==='e')a=a.filter(x=>x.tp==='Withdrawal');else if(S.type==='i')a=a.filter(x=>x.tp==='Deposit');else if(S.type==='t')a=a.filter(x=>x.tp==='Transfer');
 if(q)a=a.filter(x=>(x.p+x.c+x.n+(D.A[x.a]?.name||'')).toLowerCase().includes(q));
 a.sort((p,q)=>q.d>p.d?1:q.d<p.d?-1:q.id-p.id);const tot=a.filter(x=>x.tp!=='Transfer').reduce((s,x)=>s+x.v,0);
 return`<small class=mu>${a.length} movimientos · neto sin transferencias ${fm(tot)}</small>`+a.slice(0,S.lim).map(mv).join('')+(a.length>S.lim?`<div style="text-align:center;padding:12px"><button class=ch data-a=more>Ver más</button></div>`:'')}
function movs(){
 const ty=[['all','Todo'],['e','Gastos'],['i','Ingresos'],['t','Transf.'],['plan','Planificadas']],fl=Object.entries(S.f);
 return`<div class=sw>${ty.map(([k,l])=>`<button class="ch${S.type===k?' on':''}" data-a=typ data-v=${k}>${l}</button>`).join('')}</div>${fl.length?`<div class=sw>${fl.map(([k,v])=>`<button class="ch on" data-a=clr>${E(v)} ✕</button>`).join('')}</div>`:''}<input type=search id=sq placeholder="Buscar beneficiario, categoría, nota…" value="${E(S.q)}"/><div id=ml>${list()}</div>`}

const cats=()=>rank('c'),pay=()=>rank('p');
function render(){
 const app=$('#app');
 if(!D){app.innerHTML=`<div class=w><h1>MMEX <span class=or>Viewer</span></h1><div class=cd style="margin-top:20px;text-align:center;padding:40px 20px"><p>Abrí tu archivo <b>.mmex</b> de MoneyManager EX</p><p class=mu style="margin:8px 0 16px">Se lee solo en tu dispositivo, no se sube a ningún lado.</p><button class=pb data-a=open>Elegir archivo</button>${S.err?`<p class=rd style="margin-top:14px">${E(S.err)}</p>`:''}</div></div>`;return}
 const yrs=[...new Set(D.T.map(x=>x.d.slice(0,4)))].sort().reverse(),np=D.T.filter(x=>x.plan&&x.tp!=='Transfer').length,
 tabs=[['panel','Panel'],['cats','Categ.'],['pay','Benef.'],['pers','Períodos'],['movs','Movs.']];
 app.innerHTML=`<div class=w><div class=hd><div><h1>MMEX <span class=or>Viewer</span></h1><small class=mu>${E(D.fn)} · mod. ${D.fd}</small></div><button class=gb data-a=open>Cambiar</button></div>
 <div class=tb>${tabs.map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-a=nav data-v=${k}>${l}</button>`).join('')}</div>
 <div class=ft><select id=acs><option value="">Todas las cuentas</option>${Object.values(D.A).sort((p,q)=>p.name.localeCompare(q.name)).map(x=>`<option value=${x.id}${S.acc==x.id?' selected':''}>${E(x.name)}${x.open?'':' (cerrada)'}</option>`).join('')}</select><button class="ch${S.plan?' on':''}" data-a=pl>Planif.: ${S.plan?'incluidas':'excluidas'}${np?' ('+np+')':''}</button></div>
 ${yrs.length>1?`<div class=yr><button class="ch${S.year?'':' on'}" data-a=yr data-v="">Todos</button>${yrs.map(y=>`<button class="ch${S.year===y?' on':''}" data-a=yr data-v=${y}>${y}</button>`).join('')}</div>`:''}
 <div class=fade>${({panel,cats,pay,pers,movs})[S.tab]()}</div></div>`}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const{a,t,v}=el.dataset,go=()=>{S.tab='movs';S.type='all';S.lim=150;S.q=''};
 if(a==='open')return $('#fi').click();
 ({nav:()=>{S.tab=v;S.f={};S.lim=150;S.type='all';S.q=''},drill:()=>{S.f={[t]:v};go()},acc:()=>{S.acc=v;S.f={};go()},typ:()=>{S.type=v;S.tab='movs'},pl:()=>S.plan=!S.plan,yr:()=>S.year=v,lvl:()=>S.lvl=+v,per:()=>S.per=v,clr:()=>S.f={},more:()=>S.lim+=200})[a]?.();
 if(a==='yr'&&S.tab==='pers'&&el.dataset.t==='m')S.tab='pers';render();if(a==='nav'||a==='drill')scrollTo(0,0)});
document.addEventListener('change',e=>{if(e.target.id==='acs'){S.acc=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='sq'){S.q=e.target.value;S.lim=150;$('#ml').innerHTML=list()}});
$('#fi').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const b=await f.arrayBuffer(),d=new Date(f.lastModified).toLocaleDateString('es-PY');await load(b,f.name,d);if(D)idb('set',{b,n:f.name,d});e.target.value=''});
